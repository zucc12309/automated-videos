[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-video-mcp"
version = "0.2.0"
description = "Local English explainer video production over MCP"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=1.12,<2", "pydantic>=2,<3", "httpx", "feedparser", "kokoro", "soundfile", "numpy"]

[project.optional-dependencies]
# CLAUDE / HYBRID creative direction (runtime API path)
claude = ["anthropic>=1.15,<2"]
# HYBRID cinematic footage via the official Higgsfield SDK
higgsfield = ["higgsfield-client>=0.2,<0.3"]
dev = ["pytest"]

[project.scripts]
local-video-mcp = "video_mcp.server:main"
local-video = "video_mcp.engine:main"

[tool.setuptools.packages.find]
include = ["video_mcp*"]

[tool.setuptools.package-data]
video_mcp = ["data/*.json"]
